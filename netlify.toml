[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  # Playwright es solo para `npm run e2e` local: el build nunca descarga navegadores.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/static/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
